<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Lights - Métricas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="topnav">
        <a href="index.html" class="logo">Cinema <span>Lights</span></a>
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="listado_tabla.html">Vista Tabla</a>
            <a href="listado_box.html">Vista Tarjetas</a>
            <a href="metricas.html" class="active">Métricas</a>
            <a href="login.html" class="btn-login">Login</a>
        </div>
    </nav>

    <main class="main-content">
        <section class="metricas-panel card">
            <h2>Panel de métricas</h2>
            <p class="subtitle">Elegí qué métrica querés ver</p>

            <div class="metricas-controles">
                <label for="selector-metricas">Métrica:</label>
                <select id="selector-metricas">
                    <option value="">-- Seleccionar --</option>
                    <option value="entradas">Entradas vendidas</option>
                    <option value="combos">Combos vendidos</option>
                    <option value="visitas">Visitas por día</option>
                    <option value="recaudacion">Recaudación total</option>
                </select>

                <button type="button" id="btn-actualizar-metricas" class="btn-submit">
                    Actualizar
                </button>
            </div>

            <div id="resultado-metricas" class="resultado-metricas">
                <p class="placeholder">Seleccioná una métrica para ver los datos.</p>
            </div>
        </section>
    </main>
    
    <footer class="site-footer">
        © 2026 - Cinema Lights Posadas · Universidad de la Cuenca del Plata · Paradigmas III
    </footer>

    <script src="app.js"></script>
</body>
</html>
