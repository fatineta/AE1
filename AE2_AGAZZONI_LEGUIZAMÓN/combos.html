<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Lights - Inicio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="topnav">
        <a href="index.html" class="logo">Cinema <span>Lights</span></a>
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="listado_tabla.html">Vista Tabla</a>

    <main class="candy-shop-container">
        <h1 style="color: #cc0000; font-size: 2rem; margin-bottom: 2px;">Combos</h1>
        <p style="margin-top: 0; color: #555;">Añade combos a tu carrito</p>
        
        
        <div id="lista-combos"></div>

       
        <div class="cupon-section" style="margin-top: 20px;">
            <label for="cupon-input">¿Tenés un cupón?</label>
            <input type="text" id="cupon-input" placeholder="Ingresa tu codigo">
            <button type="button" id="btn-cupon">Aplicar</button>
            <p id="mensaje-cupon"></p>

        </div>
        <div class="checkout-summary">
            <h2>Total a pagar: <span id="total-price">$0</span></h2>

            <div class="acciones" style="display: flex; gap: 10px; margin-top: 15px;">
                <button type="button" id="btn-confirmar" class="bton-submit">Confirmar pedido</button>
                <button type="button" id="btn-omitir" class="bton-submit";>Omitir</button>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        © 2026 - Cinema Lights Posadas · Universidad de la Cuenca del Plata · Paradigmas III
    </footer>
